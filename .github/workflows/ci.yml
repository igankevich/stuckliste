---
name: CI
on:
  push:
    branches: [master]
    tags: ['*']
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref
    }}
  cancel-in-progress: true
env:
  RUST_BACKTRACE: 1
  RUST_VERSION: 1.98.1
  ARBTEST_BUDGET_MS: 5000
jobs:
  ubuntu:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4.1.4
      - name: Init
        run: ./ci/init.sh
      - name: Install Rust
        run: ./ci/rust.sh
      - name: Test
        run: ./ci/test.sh
  macos:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4.1.4
      - name: Init
        run: ./ci/init.sh
      - name: Install Rust
        run: ./ci/rust.sh
      - name: Test
        run: ./ci/test.sh
  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4.1.4
      - name: Init
        shell: bash
        run: ./ci/init.sh
      - name: Install Rust
        shell: bash
        run: ./ci/rust.sh
      - name: Install Rust
        shell: bash
        run: ./ci/test.sh
  build-ubuntu:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4.1.4
      - name: Init
        run: ./ci/init.sh
      - name: Build relese binaries
        run: ./ci/build.sh
      - name: Upload archives as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: stuckliste-ubuntu
          path: stuckliste-${{ env.OS }}-${{ env.ARCH }}-${{ env.VERSION }}.tar.gz
          compression-level: 0
          if-no-files-found: error
          retention-days: 1
  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4.1.4
      - name: Init
        run: ./ci/init.sh
      - name: Brew
        run: ./ci/brew.sh
      - name: Build relese binaries
        run: ./ci/build.sh
      - name: Upload archives as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: stuckliste-macos
          path: stuckliste-${{ env.OS }}-${{ env.ARCH }}-${{ env.VERSION }}.tar.gz
          compression-level: 0
          if-no-files-found: error
          retention-days: 1
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4.1.4
      - name: Init
        shell: bash
        run: ./ci/init.sh
      - name: Build relese binaries
        shell: bash
        run: ./ci/build.sh
      - name: Upload archives as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: stuckliste-windows
          path: stuckliste-${{ env.OS }}-${{ env.ARCH }}-${{ env.VERSION }}.tar.gz
          compression-level: 0
          if-no-files-found: error
          retention-days: 1
  publish:
    needs:
      - ubuntu
      - macos
      - windows
      - build-ubuntu
      - build-macos
      - build-windows
    if: github.ref_type == 'tag'
    permissions:
      contents: write
      packages: read
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4.1.4
      - name: Init
        run: ./ci/init.sh
      - name: Download Linux binaries
        uses: actions/download-artifact@v5
        with:
          name: stuckliste-ubuntu
      - name: Download MacOS binaries
        uses: actions/download-artifact@v5
        with:
          name: stuckliste-macos
      - name: Download Windows binaries
        uses: actions/download-artifact@v5
        with:
          name: stuckliste-windows
      - name: List files
        run: ls -l *.tar.gz
      - name: Create release
        uses: actions/create-release@v1
        id: create_release
        with:
          tag_name: ${{ github.ref_name }}
          release_name: Release ${{ env.VERSION }}
          draft: true
          prerelease: false
      - name: Upload Linux binaries
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: stuckliste-Linux-x86_64-${{ env.VERSION }}.tar.gz
          asset_name: stuckliste-Linux-x86_64-${{ env.VERSION }}.tar.gz
          asset_content_type: application/gzip
      - name: Upload MacOS binaries
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: stuckliste-Darwin-arm64-${{ env.VERSION }}.tar.gz
          asset_name: stuckliste-Darwin-arm64-${{ env.VERSION }}.tar.gz
          asset_content_type: application/gzip
      - name: Upload Windows binaries
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: stuckliste-Windows-x86_64-${{ env.VERSION }}.tar.gz
          asset_name: stuckliste-Windows-x86_64-${{ env.VERSION }}.tar.gz
          asset_content_type: application/gzip
