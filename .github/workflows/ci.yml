---
name: CI
on: [pull_request]
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref
    }}
  cancel-in-progress: true
env:
  RUST_BACKTRACE: 1
  RUST_VERSION: 1.98.1
jobs:
  ubuntu:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4.1.4
      - name: Init
        run: ./ci/init.sh
      - name: Init Ubuntu
        run: ./ci/rust.sh
      - name: Test
        run: ./ci/test.sh
  macos:
    runs-on: macos-latest
    env:
      # run each test for 5 seconds
      ARBTEST_BUDGET_MS: 5000
    steps:
      - name: Checkout
        uses: actions/checkout@v4.1.4
      - name: Init
        run: ./ci/init.sh
      - name: Init MacOS
        run: ./ci/rust.sh
      - name: Test
        run: ./ci/test.sh
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4.1.4
      - name: Init
        run: ./ci/init.sh
      - name: Build relese binaries
        run: ./ci/build.sh
      - name: Upload archives as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: stuckliste
          path: stuckliste-${{ github.ref_name }}.tar.gz
          compression-level: 0
          if-no-files-found: error
          retention-days: 1
  publish:
    needs: [ubuntu, macos, build]
    if: github.ref_type == 'tag'
    permissions:
      contents: write
      packages: read
    runs-on: ubuntu-latest
    steps:
      - name: Download Linux binaries
        uses: actions/download-artifact@v5
        with:
          name: stuckliste
      - name: List files
        run: ls -l *.tar.gz
      - name: Create release
        uses: actions/create-release@v1
        id: create_release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          release_name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
      - name: Upload binaries
        id: upload-release-asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./stuckliste-${{ github.ref_name }}.tar.gz
          asset_name: stuckliste-${{ github.ref_name }}.tar.gz
          asset_content_type: application/gzip
